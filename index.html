<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="プリビズ">
<meta name="description" content="iPhoneで動く簡易3Dプリビズ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ポケットプリビズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage with a slim header and a thumb-zone dock (transport · panel · tab bar), styled like an on-set monitor: gaffer-tape amber for pieces, cyan for the camera */
:root{
  --bg:#0d1115;
  --stage:#13181d;
  --panel:#151a20;
  --panel2:#1c232b;
  --panel3:#242c35;
  --line:#2a333d;
  --fg:#e8ecef;
  --muted:#8a96a3;
  --amber:#f0b03a;
  --amber-ink:#1c1406;
  --amber-soft:rgba(240,176,58,.14);
  --cyan:#5ec4e2;
  --cyan-soft:rgba(94,196,226,.14);
  --rec:#ff5252;
  --on-rec:#ffffff;
  --danger:#ff8a7a;
  --scrim:rgba(5,8,11,.72);
  --glass:rgba(16,21,26,.78);
  --guide:rgba(255,255,255,.22);
  --frame:rgba(255,255,255,.5);
  --hud-shadow:rgba(0,0,0,.8);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{-webkit-user-select:text;user-select:text}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.ico{width:16px;height:16px;fill:currentColor;flex:none}
.si{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
button,.btn{font:500 13.5px/1 var(--f-body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.pri{background:var(--amber);color:var(--amber-ink);border-color:transparent;font-weight:700}
button.cam{background:var(--cyan);color:var(--amber-ink);border-color:transparent;font-weight:700}
button.ghost{background:transparent}
button.danger,.danger{color:var(--danger)}
button:disabled{opacity:.35;cursor:default}
.ib{width:40px;min-width:40px;padding:0}
.grow{flex:1}

/* header */
.top{display:flex;align-items:center;gap:8px;padding-block:7px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.top .ib{background:transparent;border-color:transparent;width:38px;min-width:38px}
.hist{display:flex;gap:2px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;min-height:34px;padding:0 12px;color:var(--muted);border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.seg.view{margin-inline:auto}
.seg.view button{padding:0 10px;gap:5px;font-size:12.5px}
.seg.view .si{width:17px;height:17px}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.recbtn{font:600 12px/1 var(--f-mono);letter-spacing:.08em;padding:0 11px;min-height:36px}
.recbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--rec)}
.is-rec .recbtn{background:var(--rec);color:var(--on-rec);border-color:transparent}
.is-rec .recbtn .dot{background:var(--on-rec)}
.is-rec .seg.view,.is-rec .hist{pointer-events:none;opacity:.4}
@media (max-width:370px){.seg.view span{display:none}}

/* stage */
#stage{position:relative;flex:1;min-height:0;touch-action:none;background:var(--stage);overflow:hidden}
#stage.tracing{box-shadow:inset 0 0 0 3px var(--rec)}
#c{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;font:700 11px/1.2 var(--f-body);padding:3px 7px;border-radius:5px;background:var(--scrim);color:var(--fg);white-space:nowrap;will-change:transform}
.lab.sel{background:var(--amber);color:var(--amber-ink)}
#tools{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.rail{flex-direction:column;gap:3px;width:52px;min-height:52px;padding:6px 0 5px;font-size:10px;font-weight:500;background:var(--glass);border-color:var(--line);border-radius:12px;color:var(--fg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rail[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:transparent;font-weight:700}
#traceBtn[aria-pressed="true"]{background:var(--rec);color:var(--on-rec)}
.fab{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:12px;z-index:2;min-height:48px;padding:0 18px 0 14px;border-radius:24px;background:var(--amber);color:var(--amber-ink);border:0;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab .si{stroke-width:2.4}
.is-rec #tools,.is-rec .fab{display:none}
#frame{position:absolute;pointer-events:none;outline:1px solid var(--frame);background-image:linear-gradient(to right,transparent calc(33.333% - .5px),var(--guide) 0,var(--guide) calc(33.333% + .5px),transparent 0,transparent calc(66.666% - .5px),var(--guide) 0,var(--guide) calc(66.666% + .5px),transparent 0),linear-gradient(to bottom,transparent calc(33.333% - .5px),var(--guide) 0,var(--guide) calc(33.333% + .5px),transparent 0,transparent calc(66.666% - .5px),var(--guide) 0,var(--guide) calc(66.666% + .5px),transparent 0)}
.hud{position:absolute;font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--fg);text-shadow:0 1px 3px var(--hud-shadow);padding:8px}
.hud.tl{left:0;top:0}.hud.tr{right:0;top:0}.hud.bl{left:0;bottom:0}.hud.br{right:0;bottom:0;color:var(--rec);display:none;align-items:center;gap:6px}
.hud.br i{width:8px;height:8px;border-radius:50%;background:var(--rec)}
.is-rec .hud.br{display:flex}
#toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--panel3);border:1px solid var(--line);color:var(--fg);font-size:13px;line-height:1.45;padding:9px 14px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center;text-wrap:balance;z-index:3}
#toast.on{opacity:1}
#hint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:14px;font:500 12px/1.3 var(--f-body);color:var(--cyan);background:var(--scrim);padding:7px 11px;border-radius:8px;pointer-events:none}

/* dock */
.dock{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
.grip{display:flex;justify-content:center;align-items:center;min-height:16px;height:16px;width:100%;padding:0;border:0;border-radius:0;background:transparent}
.grip i{width:38px;height:4px;border-radius:2px;background:var(--line)}
.transport{display:flex;align-items:center;gap:10px;padding-block:2px 10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.transport button{min-height:40px;width:42px;padding:0;border-radius:10px}
#play{background:var(--fg);color:var(--bg);border-color:transparent;width:48px}
.tc{font:500 13px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tc span{color:var(--muted);font-size:11px}
.scrub{position:relative;flex:1;min-width:0;height:38px}
.scrub input{position:absolute;inset:0;width:100%;height:100%;margin:0;-webkit-appearance:none;appearance:none;background:transparent}
.scrub input::-webkit-slider-runnable-track{height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:32px;border-radius:2px;background:var(--fg);margin-top:-5px;border:0}
.scrub input::-moz-range-track{height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.scrub input::-moz-range-thumb{width:4px;height:32px;border-radius:2px;background:var(--fg);border:0}
#marks{position:absolute;inset:0;pointer-events:none;z-index:1}
.mk{position:absolute;top:58%;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);background:var(--amber)}
.mk.cam{top:36%;background:var(--cyan)}
.mk.ez{border-radius:50%;transform:translate(-50%,-50%)}
#panes{height:clamp(170px,32vh,300px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);padding-block:12px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.dock.collapsed #panes{display:none}
.dock.collapsed .grip i{background:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex-direction:column;gap:3px;border:0;border-radius:0;background:transparent;color:var(--muted);min-height:54px;padding:6px 0 4px;font-size:10.5px;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--amber);font-weight:700}
.tabs button[data-tab="cam"][aria-selected="true"]{color:var(--cyan)}
.dock.collapsed .tabs button[aria-selected="true"]{color:var(--fg)}
.is-rec .dock{pointer-events:none;opacity:.45}

/* panel building blocks */
.lbl{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:7px}
.btnrow,.chips,.swatches,.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.phead{display:flex;align-items:center;gap:8px;min-height:42px}
.phead .sp{flex:1}
.phead .ib{background:transparent}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.sw.lg{width:22px;height:22px;border-radius:6px}
.meta{font:500 11px/1 var(--f-mono);color:var(--muted);white-space:nowrap}
.nm{font:700 17px/1.2 var(--f-body);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--muted);border-radius:0;padding:4px 2px;width:8.5em;min-width:0;flex:0 1 auto}
.nm:focus{outline:none;border-bottom:1px solid var(--amber)}
.swb{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;background:var(--c);border:2px solid transparent}
.swb.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.cpick{width:30px;height:30px;border-radius:50%;overflow:hidden;position:relative;border:2px dashed var(--muted);display:inline-block}
.cpick input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;padding:0;opacity:0;cursor:pointer}
.cpick::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700;pointer-events:none}
.sec{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r)}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px 0 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .si{width:18px;height:18px;color:var(--muted);transition:transform .15s}
.sec[open]>summary .si{transform:rotate(180deg)}
.sec>summary small{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:8px;margin-right:auto}
.secb{display:flex;flex-direction:column;gap:8px;padding:2px 14px 14px}
.fld{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;align-items:center;gap:10px;min-height:40px}
.fld>label{color:var(--muted);font-size:12.5px;line-height:1.25}
.fld.dis{opacity:.4}
.fld select,.fld .seg{grid-column:2 / 4}
.fld .seg{justify-self:start}
select{font:500 16px var(--f-body);color:var(--fg);background:var(--panel3);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 10px;width:100%}
.fld input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
.fld input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line)}
.fld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--fg);margin-top:-10px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.fld input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.fld input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--fg);border:0}
.numw{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.numin{width:4.4em;font:500 16px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 6px;text-align:right;-moz-appearance:textfield;appearance:textfield}
.numin::-webkit-inner-spin-button,.numin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numin:focus{outline:none;border-color:var(--amber)}
.numw i{font-style:normal;font-size:11px;color:var(--muted);min-width:1.6em}
.chip{min-height:32px;padding:0 10px;font:500 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.chip::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--amber)}
.chip.cam::before{background:var(--cyan)}
.chip.ez::before{border-radius:50%;transform:none;width:7px;height:7px}
.chip.on{border-color:var(--fg);background:var(--panel3)}
.pick{min-height:34px;padding:0 11px;font:500 12.5px/1 var(--f-mono)}
.pick.on{background:var(--fg);color:var(--bg);border-color:transparent}
.tog{justify-content:flex-start;gap:10px;background:transparent;border:0;padding:0;min-height:40px;color:var(--fg);white-space:normal;text-align:left;line-height:1.35}
.tog .knob{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog .knob::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .15s}
.tog[aria-pressed="true"] .knob{background:var(--amber)}
.tog[aria-pressed="true"] .knob::after{transform:translateX(16px);background:var(--amber-ink)}
.hint{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6;max-width:62ch}
.hint.small{font-size:12px}
.muted{color:var(--muted);font-size:12px}
.row2{display:flex;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:40px;padding:0}
.num{font:500 13px/1 var(--f-mono);min-width:3.4em;text-align:center}
.div{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.btncol{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:380px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-block:4px}
.empty p{margin:0}
.big{min-height:48px;padding:0 20px;font-size:15px;border-radius:12px}
.keybar{display:flex;gap:8px}
.keybar .pri{flex:1;min-height:46px;font-size:15px;border-radius:12px}
.keybar .ib{min-height:46px;width:46px;border-radius:12px}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mode{flex-direction:column;gap:5px;min-height:62px;padding:8px 0;font-size:12px;border-radius:12px;background:var(--panel2)}
.mode[aria-pressed="true"]{background:var(--cyan-soft);border-color:var(--cyan);color:var(--fg);font-weight:700}
.mode[aria-pressed="true"] .si{color:var(--cyan)}
.spins{display:flex;flex-direction:column;gap:6px}
.spin{display:grid;grid-template-columns:3.6em 1fr 1fr;gap:7px;align-items:center}
.spin span{color:var(--muted);font-size:12.5px}
.tips{margin:0;padding-left:1.1em;color:var(--muted);font-size:12.5px;line-height:1.7}
.tips b{color:var(--fg);font-weight:700}
.list{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:6px;padding-left:calc(var(--d) * 20px);position:relative}
.lrow[style*="--d:1"]::before,.lrow[style*="--d:2"]::before,.lrow[style*="--d:3"]::before{content:"";position:absolute;left:calc(var(--d) * 20px - 12px);top:7px;width:8px;height:13px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.lmain{flex:1;min-width:0;justify-content:flex-start;gap:8px;background:transparent;border-color:transparent;padding:0 8px}
.lmain b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.lmain .meta{overflow:hidden;text-overflow:ellipsis}
.lrow.on .lmain{border-color:var(--amber);background:var(--amber-soft)}
.lrow.off .lmain{opacity:.45}
.eye{min-height:32px;padding:0 9px;font-size:11.5px}
.eye[aria-pressed="false"]{color:var(--muted)}
.tl{position:relative;--nw:116px;display:flex;flex-direction:column;gap:3px}
.tlrow{display:flex;align-items:center;min-height:34px}
.tlname{width:var(--nw);flex:none;justify-content:flex-start;gap:6px;padding:0 6px 0 calc(var(--d,0) * 12px);background:transparent;border:0;min-height:34px;font-size:12.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tltrack{position:relative;flex:1;min-width:0;height:28px;background:var(--bg);border:1px solid var(--line);border-radius:6px;touch-action:pan-y;cursor:pointer}
.tlrow.on .tltrack{border-color:var(--amber)}
.tlrow.on .tlname{color:var(--amber)}
.tlrow.off{opacity:.45}
.tlruler .tltrack{background:transparent;border-color:transparent;height:18px}
.tick{position:absolute;bottom:0;font:500 10px/1 var(--f-mono);color:var(--muted);transform:translateX(-50%);pointer-events:none}
.tlbar{position:absolute;top:50%;height:4px;margin-top:-2px;background:var(--amber);opacity:.35;border-radius:2px;pointer-events:none}
.tlbar.cam{background:var(--cyan)}
.tk{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);background:var(--amber);touch-action:none;cursor:grab;z-index:1}
.tk::after{content:"";position:absolute;inset:-9px}
.tk.ez{border-radius:50%;transform:none}
.tk.cam{background:var(--cyan)}
.tk.drag{outline:2px solid var(--fg);z-index:3}
.tlnote{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none}
#tlhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;z-index:2;opacity:.85}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.card{background:var(--panel);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.cardhead{display:flex;align-items:center;justify-content:space-between}
.card h2{margin:0;font-size:17px;font-weight:700}
.card video{width:100%;max-height:48vh;background:var(--bg);border-radius:8px;display:block}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{flex-direction:column;gap:6px;min-height:76px;padding:10px 2px;border-radius:12px;font-size:11px;letter-spacing:-.02em;line-height:1.2;white-space:normal;text-align:center;background:var(--panel2)}
.tile .si{width:28px;height:28px;color:var(--amber)}
#reccv{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

@media (orientation:landscape) and (max-height:560px){
  #main{flex-direction:row}
  .dock{width:min(380px,48vw);border-top:0;border-left:1px solid var(--line)}
  #panes{height:auto;flex:1;min-height:0}
  .dock.collapsed #panes{display:flex}
  .grip{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
'use strict';
const D2R=Math.PI/180, FPS=24, SKEY='pocket-previz-v1', PKEY='pocket-previz-pref';
const TYPES={
  person:{label:'人',foot:.45,g:'basic'},
  car:{label:'車',foot:2.5,g:'basic'},
  opencar:{label:'オープンカー',foot:2.5,g:'basic'},
  box:{label:'箱',foot:.85,g:'basic'},
  ball:{label:'球',foot:.4,g:'basic'},
  wall:{label:'壁',foot:2.3,g:'basic'},
  pillar:{label:'柱',foot:.45,g:'basic'},
  dog:{label:'犬',foot:.55,g:'animal'},
  cat:{label:'猫',foot:.4,g:'animal'},
  horse:{label:'馬',foot:1.25,g:'animal'},
  bird:{label:'鳥',foot:.35,g:'animal'},
  glass:{label:'透明ブロック',foot:.75,g:'block'},
  camrig:{label:'撮影カメラ',foot:.45,g:'hidden'}
};
const TYPE_GROUPS=[['basic','コマを置く'],['animal','動物'],['block','ブロック']];
const BLOCK_BASE={box:[1,1,1],wall:[4,2.5,.2],pillar:[.5,3,.5],glass:[1,1,1]};
const MOVERS=new Set(['person','car','opencar','ball','dog','cat','horse','bird','camrig']);
const CARS=new Set(['car','opencar']);
const SEATS=[[-.4,0],[.4,0],[-.4,-.85],[.4,-.85]];
const SEAT_NAMES=['運転席（右前）','助手席（左前）','後ろ右','後ろ左'];
const SEAT_H={car:.5,opencar:.64};
const EYE={person:[0,1.66,.17],pin:[0,1.55,.21],dog:[0,.78,.6],cat:[0,.52,.42],horse:[0,2.05,1.45],bird:[0,.25,.27],car:[-.4,1.24,.17],opencar:[-.4,1.38,.17]};
const COLORS=['#e9e4da','#e07a5f','#f2cc8f','#81b29a','#6aa9d8','#b39ddb','#9aa5b1','#4a4f63','#c99a6b','#6b5444'];
const ASPECTS={'16:9':16/9,'2.39:1':2.39,'4:3':4/3,'1:1':1,'9:16':9/16};
const LENSES=[18,24,35,50,85,135];
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const snap=t=>Math.round(t*FPS)/FPS;
const n360=r=>((r%360)+360)%360;
const r3=v=>Math.round(v*1000)/1000;
function tc(t){const f=Math.round(t*FPS),s=Math.floor(f/FPS),r=f%FPS;return String(s).padStart(2,'0')+':'+String(r).padStart(2,'0');}

/* ---------- scene data ---------- */
function sampleScene(){
  return {duration:8,pieces:[
    {id:'p1',type:'person',name:'人1',color:'#e07a5f',face:true,base:{x:-4,y:0,z:3,r:90},keys:[{t:0,x:-4,y:0,z:3,r:90},{t:3,x:0,y:0,z:1,r:90},{t:6,x:3,y:0,z:-2,r:90}]},
    {id:'p2',type:'person',name:'人2',color:'#6aa9d8',face:false,base:{x:2.6,y:0,z:-3.4,r:210},keys:[]},
    {id:'p3',type:'car',name:'車1',color:'#9aa5b1',face:true,base:{x:-14,y:0,z:-5.2,r:90},keys:[{t:0,x:-14,y:0,z:-5.2,r:90},{t:8,x:14,y:0,z:-5.2,r:90}]},
    {id:'p4',type:'box',name:'箱1',color:'#f2cc8f',face:false,base:{x:4.2,y:0,z:2,r:15},keys:[]},
    {id:'p5',type:'wall',name:'壁1',color:'#e9e4da',face:false,base:{x:0,y:0,z:-7.4,r:0},keys:[]},
    {id:'p6',type:'pillar',name:'柱1',color:'#e9e4da',face:false,base:{x:-2.2,y:0,z:-1.2,r:0},keys:[]}
  ],cam:{mode:'orbit',target:'p1',lens:35,lookH:1.3,shake:.15,aspect:'16:9',
    orbit:{radius:5,height:1.7,speed:25,start:200},
    follow:{dist:4,angle:160,height:1.8},pov:{yaw:0,pitch:-4},povSmooth:.5,povSelf:false,keys:[]},
    scene:{bg:'#13181d',ground:'#2b3239',grid:'1',gridShot:true}};
}
function num(v,d){v=+v;return isFinite(v)?v:d;}
function defSize(type){return type==='glass'?{x:2,y:2,z:2}:{x:1,y:1,z:1};}
function normSize(s,type){const d=defSize(type);if(!s||typeof s!=='object')return d;return {x:clamp(num(s.x,d.x),.02,50),y:clamp(num(s.y,d.y),.02,50),z:clamp(num(s.z,d.z),.02,50)};}
function normalize(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.pieces)) throw new Error('bad scene');
  const d=sampleScene(), sc=s.cam&&typeof s.cam==='object'?s.cam:{};
  const cam=Object.assign({},d.cam,sc);
  cam.orbit=Object.assign({},d.cam.orbit,sc.orbit||{});
  cam.follow=Object.assign({},d.cam.follow,sc.follow||{});
  cam.pov=Object.assign({},d.cam.pov,sc.pov||{});
  cam.povKeys=Array.isArray(sc.povKeys)?sc.povKeys.filter(k=>k&&isFinite(k.t)).map(k=>({t:+k.t,yaw:num(k.yaw,0),pitch:clamp(num(k.pitch,0),-60,60)})).sort((a,b)=>a.t-b.t):[];
  cam.keys=Array.isArray(sc.keys)?sc.keys.filter(k=>k&&isFinite(k.t)).map(k=>({t:+k.t,px:num(k.px,0),py:num(k.py,1),pz:num(k.pz,0),tx:num(k.tx,0),ty:num(k.ty,1),tz:num(k.tz,0)})).sort((a,b)=>a.t-b.t):[];
  if(!ASPECTS[cam.aspect]) cam.aspect='16:9';
  if(!['orbit','follow','pov','keys','rig'].includes(cam.mode)) cam.mode='orbit';
  cam.rigAim=!!cam.rigAim;
  cam.povSmooth=clamp(num(cam.povSmooth,.5),0,1.5); cam.povSelf=!!cam.povSelf;
  cam.lens=clamp(num(cam.lens,35),12,200); cam.shake=clamp(num(cam.shake,0),0,1); cam.lookH=num(cam.lookH,1.2);
  const pieces=[];
  for(const p of s.pieces){
    if(!p||!TYPES[p.type]) continue;
    const b=p.base||{};
    pieces.push({id:String(p.id||uid()),type:p.type,name:String(p.name||TYPES[p.type].label).slice(0,20),
      color:/^#[0-9a-f]{6}$/i.test(p.color)?p.color:COLORS[0],face:!!p.face,
      size:normSize(p.size,p.type),opacity:clamp(num(p.opacity,.3),.05,.9),hideInShot:!!p.hideInShot,style:p.style==='pin'?'pin':'figure',
      ride:typeof p.ride==='string'?p.ride:null,seat:clamp(Math.round(num(p.seat,0)),0,3),
      parent:typeof p.parent==='string'?p.parent:null,hidden:!!p.hidden,
      base:{x:num(b.x,0),y:num(b.y,0),z:num(b.z,0),r:num(b.r,0),rx:num(b.rx,0),rz:num(b.rz,0)},pivot:p.pivot==='center'?'center':'base',
      keys:(Array.isArray(p.keys)?p.keys:[]).filter(k=>k&&isFinite(k.t)).map(k=>({t:+k.t,x:num(k.x,0),y:num(k.y,0),z:num(k.z,0),r:num(k.r,0),rx:num(k.rx,0),rz:num(k.rz,0),ease:!!k.ease})).sort((a,b)=>a.t-b.t)});
  }
  for(const p of pieces) if(p.ride&&(p.type!=='person'||!pieces.some(q=>q.id===p.ride&&CARS.has(q.type)))) p.ride=null;
  const byId=new Map(pieces.map(q=>[q.id,q]));
  for(const p of pieces){ /* drop missing or circular parents */
    if(!p.parent) continue;
    if(!byId.has(p.parent)||p.parent===p.id||p.ride){p.parent=null;continue;}
    let x=byId.get(p.parent),n=0; while(x&&x.parent&&n<60){if(x.parent===p.id){p.parent=null;break;} x=byId.get(x.parent); n++;}
  }
  if(cam.target&&!pieces.some(p=>p.id===cam.target)) cam.target=null;
  const ss=s.scene&&typeof s.scene==='object'?s.scene:{}, hex=v=>/^#[0-9a-f]{6}$/i.test(v);
  const scn={bg:hex(ss.bg)?ss.bg:d.scene.bg,ground:hex(ss.ground)?ss.ground:d.scene.ground,grid:['off','1','5','10'].includes(String(ss.grid))?String(ss.grid):d.scene.grid,gridShot:ss.gridShot!==false};
  return {duration:clamp(Math.round(num(s.duration,8)*10)/10,1,120),pieces,cam,scene:scn};
}
let state=null, fromSample=false;
try{const raw=localStorage.getItem(SKEY); if(raw) state=normalize(JSON.parse(raw));}catch(e){state=null;}
if(!state){state=normalize(sampleScene());fromSample=true;}
const pref={tab:'piece',loop:true,labels:true,lock:false,listMode:'list'};
try{Object.assign(pref,JSON.parse(localStorage.getItem(PKEY)||'{}'));}catch(e){}
function savePref(){try{localStorage.setItem(PKEY,JSON.stringify(pref));}catch(e){}}
let saveTimer=0;
function save(){try{localStorage.setItem(SKEY,JSON.stringify(state));}catch(e){}}

let time=0, playing=false, view='edit', selId=null, manualCam=false, recording=false;
const selPiece=()=>state.pieces.find(p=>p.id===selId)||null;

/* ---------- three.js ---------- */
const stage=$('#stage'), canvas=$('#c'), panes=$('#panes'), scrub=$('#scrub');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const BG=0x13181d; scene.background=new THREE.Color(BG); scene.fog=new THREE.Fog(BG,38,95);
scene.add(new THREE.HemisphereLight(0xd8e6f5,0x30353c,.8));
const sun=new THREE.DirectionalLight(0xfff1dc,.85);
sun.position.set(9,16,7); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:60}); sun.shadow.bias=-.0005;
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x2b3239,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const gridGroup=new THREE.Group(); scene.add(gridGroup);
function applyScene(){
  const sc=state.scene; scene.background.set(sc.bg); scene.fog.color.set(sc.bg); ground.material.color.set(sc.ground);
  for(const ch of [...gridGroup.children]){gridGroup.remove(ch);disposeObj(ch);}
  if(sc.grid==='off') return;
  const sp=+sc.grid, size=100, gc=new THREE.Color(sc.ground), lum=.2126*gc.r+.7152*gc.g+.0722*gc.b, light=lum>.35;
  const add=(div,col,op,y)=>{const gh=new THREE.GridHelper(size,div,col,col);gh.position.y=y;gh.material.transparent=true;gh.material.opacity=op;gh.material.depthWrite=false;gridGroup.add(gh);};
  if(sp>1) add(size,light?0x5d6670:0x4a5561,light?.25:.35,.002);
  add(size/sp,light?0x2f3740:0x8a96a4,light?.6:.65,.004);
}

const editCam=new THREE.PerspectiveCamera(50,1,.1,400); editCam.position.set(10,8,12);
const shotCam=new THREE.PerspectiveCamera(40,16/9,.05,400);
const editCtl=new THREE.OrbitControls(editCam,canvas);
editCtl.target.set(0,.8,0); editCtl.enableDamping=true; editCtl.dampingFactor=.12;
editCtl.maxPolarAngle=Math.PI*.495; editCtl.minDistance=1.5; editCtl.maxDistance=90; editCtl.screenSpacePanning=false;
editCtl.update();
const shotCtl=new THREE.OrbitControls(shotCam,canvas);
shotCtl.enabled=false; shotCtl.rotateSpeed=.45; shotCtl.minDistance=.3; shotCtl.maxDistance=80; shotCtl.screenSpacePanning=true;
shotCtl.addEventListener('start',()=>{manualCam=true; if(playing) setPlaying(false);});
const TOP_SIZE=26;
const topCam=new THREE.OrthographicCamera(-1,1,1,-1,.1,200);
topCam.position.set(0,60,0); topCam.up.set(0,0,-1); topCam.lookAt(0,0,0);
const topCtl=new THREE.OrbitControls(topCam,canvas);
topCtl.enabled=false; topCtl.enableRotate=false; topCtl.screenSpacePanning=true; topCtl.minZoom=.25; topCtl.maxZoom=8;
topCtl.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_PAN};
topCtl.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
topCtl.target.set(0,0,0); topCtl.update();
const viewCam=()=>view==='top'?topCam:editCam;
function applyLock(){
  const L=!!pref.lock;
  editCtl.touches.ONE=L?null:THREE.TOUCH.ROTATE; editCtl.mouseButtons.LEFT=L?null:THREE.MOUSE.ROTATE;
  topCtl.touches.ONE=L?null:THREE.TOUCH.PAN; topCtl.mouseButtons.LEFT=L?null:THREE.MOUSE.PAN;
  $('#lockBtn').setAttribute('aria-pressed',String(L));
}

/* helpers visible only in the edit view */
const helpers=new THREE.Group(); scene.add(helpers);
const ring=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),new THREE.MeshBasicMaterial({color:0xf0b03a,transparent:true,opacity:.95,depthWrite:false,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.renderOrder=2; helpers.add(ring);
const pathGroup=new THREE.Group(); helpers.add(pathGroup);
const gizmo=new THREE.Group(); helpers.add(gizmo);
const gBody=new THREE.Mesh(new THREE.BoxGeometry(.32,.24,.42),new THREE.MeshStandardMaterial({color:0x2b6f84,roughness:.6}));
gBody.position.z=.2; gizmo.add(gBody);
const gLens=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,.16,16),new THREE.MeshBasicMaterial({color:0x5ec4e2}));
gLens.rotation.x=Math.PI/2; gLens.position.z=-.06; gizmo.add(gLens);
const frGeo=new THREE.BufferGeometry(); frGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(22*3),3));
gizmo.add(new THREE.LineSegments(frGeo,new THREE.LineBasicMaterial({color:0x5ec4e2})));
let lastFr='';
function setFrustum(vfov,aspect){
  const key=vfov.toFixed(3)+aspect; if(key===lastFr) return; lastFr=key;
  const d=1.6,hh=Math.tan(vfov*D2R/2)*d,hw=hh*aspect,c=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  const a=frGeo.attributes.position.array; let i=0; const P=(x,y,z)=>{a[i++]=x;a[i++]=y;a[i++]=z;};
  for(const [x,y] of c){P(0,0,0);P(x,y,-d);}
  for(let k=0;k<4;k++){const p=c[k],q=c[(k+1)%4];P(p[0],p[1],-d);P(q[0],q[1],-d);}
  P(-hw*.35,hh*1.08,-d);P(hw*.35,hh*1.08,-d);P(hw*.35,hh*1.08,-d);P(0,hh*1.4,-d);P(0,hh*1.4,-d);P(-hw*.35,hh*1.08,-d);
  frGeo.attributes.position.needsUpdate=true; frGeo.computeBoundingSphere();
}

/* piece meshes */
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:0});}
const PROXY={person:[.9,2,.9],car:[2.3,1.9,4.7],opencar:[2.3,1.6,4.7],box:[1.4,1.4,1.4],ball:[1,1,1],wall:[4.3,2.8,1],pillar:[1,3.2,1],
  dog:[.6,.95,1.2],cat:[.45,.7,.85],horse:[.9,2.4,2.4],bird:[.8,.45,.6],glass:[1.02,1.02,1.02],camrig:[.9,.8,1.1]};
const LABEL_H={person:2.05,car:1.95,opencar:1.85,box:1.3,ball:.85,wall:2.8,pillar:3.3,dog:.95,cat:.7,horse:2.45,bird:.5,glass:1.15,camrig:.55};
const sigOf=p=>p.type+p.color+(p.type==='glass'?p.opacity:'')+(p.type==='person'?p.style:'');
/* four-legged animals share one builder; numbers are metres */
const QUAD={
  dog:{bw:.28,bh:.3,bl:.7,lh:.38,lw:.08,hx:.1,hz:.26,head:[.22,.22,.26],hp:[0,.74,.44],hr:0,snout:[.12,.1,.14],ear:[.06,.1,.04],tail:[.05,.05,.32,.9],stride:.75},
  cat:{bw:.2,bh:.2,bl:.5,lh:.25,lw:.06,hx:.07,hz:.18,head:[.17,.16,.16],hp:[0,.5,.32],hr:0,snout:null,ear:[.06,.08,.03],tail:[.04,.04,.42,1.6],stride:.5},
  horse:{bw:.5,bh:.6,bl:1.5,lh:.95,lw:.14,hx:.17,hz:.55,head:[.26,.28,.6],hp:[0,1.95,1.05],hr:.5,neck:[.26,.75,.32,.6,0,1.62,.78],snout:null,ear:[.06,.14,.05],tail:[.08,.08,.6,.3],stride:1.8}
};
function buildQuad(g,q,m,dark,add){
  const legs=[];
  for(const [x,z] of [[-q.hx,q.hz],[q.hx,q.hz],[-q.hx,-q.hz],[q.hx,-q.hz]]){
    const lp=new THREE.Group(); lp.position.set(x,q.lh,z); g.add(lp);
    add(new THREE.BoxGeometry(q.lw,q.lh,q.lw),m,0,-q.lh/2,0,lp); legs.push(lp);
  }
  add(new THREE.BoxGeometry(q.bw,q.bh,q.bl),m,0,q.lh+q.bh/2,0);
  if(q.neck){const n=add(new THREE.BoxGeometry(q.neck[0],q.neck[1],q.neck[2]),m,q.neck[4],q.neck[5],q.neck[6]);n.rotation.x=q.neck[3];}
  const hg=new THREE.Group(); hg.position.set(q.hp[0],q.hp[1],q.hp[2]); hg.rotation.x=q.hr; g.add(hg);
  add(new THREE.BoxGeometry(q.head[0],q.head[1],q.head[2]),m,0,0,0,hg);
  if(q.snout) add(new THREE.BoxGeometry(q.snout[0],q.snout[1],q.snout[2]),m,0,-.03,q.head[2]/2+q.snout[2]/2,hg);
  const tipZ=q.head[2]/2+(q.snout?q.snout[2]:0);
  add(new THREE.BoxGeometry(.05,.04,.03),dark,0,q.snout?-.02:0,tipZ+.01,hg);
  for(const s of [-1,1]) add(new THREE.BoxGeometry(q.ear[0],q.ear[1],q.ear[2]),m,s*q.head[0]*.32,q.head[1]/2+q.ear[1]/2,-q.head[2]*.15,hg);
  const tp=new THREE.Group(); tp.position.set(0,q.lh+q.bh*.8,-q.bl/2); tp.rotation.x=q.tail[3]; g.add(tp);
  add(new THREE.BoxGeometry(q.tail[0],q.tail[1],q.tail[2]),m,0,0,-q.tail[2]/2,tp);
  g.userData.quad=legs; g.userData.stride=q.stride;
}
function buildPiece(p){
  const g=new THREE.Group(); g.userData.pid=p.id; g.rotation.order='YXZ';
  const m=mat(p.color), dark=mat(0x23282f);
  const add=(geo,material,x,y,z,parent)=>{const me=new THREE.Mesh(geo,material);me.position.set(x,y,z);me.castShadow=true;me.receiveShadow=true;(parent||g).add(me);return me;};
  if(p.type==='person'&&p.style==='pin'){
    /* board-game peg: tapered body, shoulder cap, round head */
    const bg=new THREE.Group(); g.add(bg);
    add(new THREE.CylinderGeometry(.17,.25,1.2,28),m,0,.6,0,bg);
    add(new THREE.SphereGeometry(.17,24,16),m,0,1.2,0,bg);
    add(new THREE.SphereGeometry(.2,24,18),m,0,1.52,0,bg);
    add(new THREE.BoxGeometry(.07,.05,.08),dark,0,1.53,.2,bg);
    g.userData.pin=bg;
  }else if(p.type==='person'){
    const legs=[],arms=[];
    for(const s of [-1,1]){
      const lp=new THREE.Group(); lp.position.set(s*.1,.92,0); g.add(lp);
      add(new THREE.BoxGeometry(.15,.9,.17),m,0,-.45,0,lp); legs.push(lp);
      const ap=new THREE.Group(); ap.position.set(s*.28,1.5,0); g.add(ap);
      add(new THREE.BoxGeometry(.1,.62,.12),m,0,-.3,0,ap); arms.push(ap);
    }
    add(new THREE.BoxGeometry(.42,.64,.24),m,0,1.24,0);
    add(new THREE.SphereGeometry(.12,18,14),m,0,1.7,0);
    add(new THREE.BoxGeometry(.07,.05,.09),dark,0,1.7,.12);
    g.userData.legs=legs; g.userData.arms=arms;
  }else if(p.type==='car'||p.type==='opencar'){
    const open=p.type==='opencar', seatM=mat(0x2a2f36), trimM=mat(0x1b1f25);
    const glassM=new THREE.MeshStandardMaterial({color:0xa9cbe0,transparent:true,opacity:open?.3:.26,depthWrite:false,roughness:.1});
    const glass=(geo,x,y,z)=>{const me=new THREE.Mesh(geo,glassM);me.position.set(x,y,z);me.renderOrder=1;g.add(me);return me;};
    if(!open){
      add(new THREE.BoxGeometry(1.8,.6,4.2),m,0,.55,0);                 /* body up to the beltline */
      add(new THREE.BoxGeometry(1.58,.07,1.95),m,0,1.465,-.15);        /* roof */
      for(const sd of [-1,1]){                                          /* A / B / C pillars */
        const a=add(new THREE.BoxGeometry(.07,.66,.08),m,sd*.76,1.15,.8); a.rotation.x=-.38;
        add(new THREE.BoxGeometry(.07,.6,.08),m,sd*.76,1.15,-.3);
        const c=add(new THREE.BoxGeometry(.07,.66,.08),m,sd*.76,1.15,-1.1); c.rotation.x=.42;
      }
      glass(new THREE.BoxGeometry(1.52,.58,1.9),0,1.15,-.15);          /* see-through cabin so riders show */
      add(new THREE.BoxGeometry(1.6,.16,.3),trimM,0,.92,.7);            /* dashboard */
    }else{
      add(new THREE.BoxGeometry(1.8,.4,4.2),m,0,.45,0);
      for(const sd of [-1,1]) add(new THREE.BoxGeometry(.12,.36,2.1),m,sd*.84,.83,-.4);
      add(new THREE.BoxGeometry(1.8,.36,1.4),m,0,.83,1.4);
      add(new THREE.BoxGeometry(1.8,.36,.9),m,0,.83,-1.65);
      add(new THREE.BoxGeometry(1.6,.16,.26),trimM,0,1.08,.76);         /* dashboard */
      const ws=glass(new THREE.BoxGeometry(1.6,.42,.03),0,1.36,.98); ws.rotation.x=-.45;
      const fr=add(new THREE.BoxGeometry(1.64,.05,.06),trimM,0,1.55,.9); fr.castShadow=false;
    }
    const sh=SEAT_H[p.type];
    for(const [x,z] of SEATS){                                          /* seats */
      add(new THREE.BoxGeometry(.5,.12,.5),seatM,x,sh-.04,z);
      const bk=add(new THREE.BoxGeometry(.5,.6,.1),seatM,x,sh+.28,z-.27); bk.rotation.x=-.15;
    }
    /* steering wheel: a ring on a column, right-hand drive */
    const wy=open?1.08:.94, wz=.52; /* about half a metre ahead of the driver's eyes and lower */
    const wheelRing=add(new THREE.TorusGeometry(.17,.022,8,28),trimM,-.4,wy,wz); wheelRing.rotation.x=-.42;
    const spoke=add(new THREE.BoxGeometry(.3,.025,.02),trimM,-.4,wy,wz); spoke.rotation.x=-.42;
    const col=add(new THREE.CylinderGeometry(.022,.022,.32,8),trimM,-.4,wy-.06,wz+.14); col.rotation.x=1.15;
    const wheels=[];
    for(const x of [-.86,.86]) for(const z of [-1.35,1.35]){const w=add(new THREE.CylinderGeometry(.34,.34,.24,16),dark,x,.34,z); w.rotation.z=Math.PI/2; wheels.push(w);}
    const lamp=new THREE.MeshBasicMaterial({color:0xfff1c1});
    for(const x of [-.6,.6]) add(new THREE.BoxGeometry(.32,.14,.04),lamp,x,open?.55:.7,2.11);
    g.userData.wheels=wheels;
  }else if(p.type==='box'){
    add(new THREE.BoxGeometry(1,1,1),m,0,.5,0);
  }else if(p.type==='ball'){
    add(new THREE.SphereGeometry(.3,24,18),m,0,.3,0);
  }else if(p.type==='wall'){
    add(new THREE.BoxGeometry(4,2.5,.2),m,0,1.25,0);
  }else if(QUAD[p.type]){
    buildQuad(g,QUAD[p.type],m,dark,add);
  }else if(p.type==='bird'){
    const body=add(new THREE.SphereGeometry(.1,16,12),m,0,.16,0); body.scale.set(1,.9,1.5);
    add(new THREE.SphereGeometry(.07,14,10),m,0,.24,.13);
    const beak=add(new THREE.ConeGeometry(.025,.08,8),mat(0xe0a040),0,.23,.22); beak.rotation.x=Math.PI/2;
    add(new THREE.BoxGeometry(.09,.015,.13),m,0,.17,-.18);
    const wings=[];
    for(const s of [-1,1]){const wp=new THREE.Group();wp.position.set(s*.08,.19,0);g.add(wp);add(new THREE.BoxGeometry(.3,.015,.15),m,s*.15,0,0,wp);wings.push(wp);}
    g.userData.wings=wings;
  }else if(p.type==='camrig'){
    g.userData.rig=true; /* drawn by the camera gizmo; only the touch target lives here */
  }else if(p.type==='glass'){
    const gm=new THREE.MeshStandardMaterial({color:p.color,transparent:true,opacity:p.opacity,depthWrite:false,roughness:.2});
    const me=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),gm); me.position.y=.5; me.renderOrder=1; g.add(me);
    const ed=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),new THREE.LineBasicMaterial({color:p.color,transparent:true,opacity:Math.min(1,p.opacity+.5)}));
    ed.position.y=.5; ed.raycast=()=>{}; g.add(ed);
    g.userData.glass=true;
  }else{
    add(new THREE.CylinderGeometry(.25,.25,3,20),m,0,1.5,0);
  }
  /* invisible, larger touch target so thin pieces are easy to grab */
  const pr=PROXY[p.type], proxy=new THREE.Mesh(new THREE.BoxGeometry(pr[0],pr[1],pr[2]),new THREE.MeshBasicMaterial({visible:false}));
  proxy.position.y=p.type==='camrig'?0:pr[1]/2; g.add(proxy);
  return g;
}
function disposeObj(o){o.traverse(x=>{if(x.geometry)x.geometry.dispose(); if(x.material)(Array.isArray(x.material)?x.material:[x.material]).forEach(mm=>mm.dispose());});}
const groups=new Map();
function syncMeshes(){
  const ids=new Set(state.pieces.map(p=>p.id));
  for(const [id,g] of groups) if(!ids.has(id)){scene.remove(g);disposeObj(g);groups.delete(id);}
  for(const p of state.pieces){
    let g=groups.get(p.id);
    if(g&&g.userData.sig!==sigOf(p)){scene.remove(g);disposeObj(g);groups.delete(p.id);g=null;}
    if(!g){g=buildPiece(p);g.userData.sig=sigOf(p);scene.add(g);groups.set(p.id,g);}
  }
}

/* ---------- motion ---------- */
/* easy ease: Hermite curve whose speed drops to zero at eased keys */
function easeU(u,e0,e1){if(!e0&&!e1)return u;const m0=e0?0:1,m1=e1?0:1,u2=u*u,u3=u2*u;return (u3-2*u2+u)*m0+(-2*u3+3*u2)+(u3-u2)*m1;}
function lerpAng(a,b,u){const d=((b-a)%360+540)%360-180;return a+d*u;}
function segIndex(k,t){if(t<=k[0].t) return 0; for(let i=0;i<k.length-1;i++) if(t<k[i+1].t) return i; return k.length-2;}
const kp=a=>({x:a.x,y:a.y,z:a.z,r:a.r,rx:a.rx||0,rz:a.rz||0});
function rawPose(p,t){
  const k=p.keys;
  if(!k.length) return kp(p.base);
  if(k.length===1||t<=k[0].t) return kp(k[0]);
  const L=k[k.length-1]; if(t>=L.t) return kp(L);
  const i=segIndex(k,t),a=k[i],b=k[i+1],u=easeU((t-a.t)/((b.t-a.t)||1),a.ease,b.ease);
  const m=f=>(a[f]||0)+((b[f]||0)-(a[f]||0))*u; /* rotations too: 0→720 spins twice */
  return {x:m('x'),y:m('y'),z:m('z'),r:m('r'),rx:m('rx'),rz:m('rz')};
}
function heading(p,t){
  const k=p.keys; if(k.length<2) return null;
  const t0=k[0].t,t1=k[k.length-1].t,tc=clamp(t,t0,t1);
  { /* direction of travel across ±0.15s: smooth even on finger-traced paths */
    const a=rawPose(p,Math.max(t0,tc-.15)),b=rawPose(p,Math.min(t1,tc+.15)),dx=b.x-a.x,dz=b.z-a.z;
    if(dx*dx+dz*dz>4e-4) return Math.atan2(dx,dz)/D2R;
  }
  const i=segIndex(k,tc);
  const dir=j=>{const dx=k[j+1].x-k[j].x,dz=k[j+1].z-k[j].z;return dx*dx+dz*dz>1e-6?Math.atan2(dx,dz)/D2R:null;};
  for(let j=i;j>=0;j--){const d=dir(j);if(d!==null)return d;}
  for(let j=i+1;j<k.length-1;j++){const d=dir(j);if(d!==null)return d;}
  return null;
}
function pieceById(id){return id?state.pieces.find(q=>q.id===id)||null:null;}
function compose(ps,l){const r=ps.r*D2R;return {x:ps.x+l.x*Math.cos(r)+l.z*Math.sin(r),y:ps.y+l.y,z:ps.z-l.x*Math.sin(r)+l.z*Math.cos(r),r:ps.r+l.r,rx:l.rx||0,rz:l.rz||0};}
function decompose(ps,w){const r=ps.r*D2R,dx=w.x-ps.x,dz=w.z-ps.z;return {x:dx*Math.cos(r)-dz*Math.sin(r),y:w.y-ps.y,z:dx*Math.sin(r)+dz*Math.cos(r),r:w.r-ps.r,rx:w.rx||0,rz:w.rz||0};}
function localPose(p,t){const s=rawPose(p,t); if(p.face){const h=heading(p,t); if(h!==null) s.r=h;} return s;}
function pose(p,t,depth){
  depth=depth||0;
  if(p.ride){ /* a passenger sits in its car's seat and moves with it */
    const car=state.pieces.find(q=>q.id===p.ride);
    if(car&&!car.ride){
      const c=pose(car,t,depth+1),cs=car.size,o=SEATS[p.seat]||SEATS[0],ox=o[0]*cs.x,oz=o[1]*cs.z,r=c.r*D2R,hip=p.style==='pin'?.8:.92;
      return {x:c.x+ox*Math.cos(r)+oz*Math.sin(r),y:c.y+SEAT_H[car.type]*cs.y-hip*p.size.y,z:c.z-ox*Math.sin(r)+oz*Math.cos(r),r:c.r,rx:0,rz:0,seated:true};
    }
  }
  const s=localPose(p,t);
  if(p.parent&&depth<30){const par=pieceById(p.parent); if(par) return compose(pose(par,t,depth+1),s);} /* a child adds its own motion to its parent's */
  return s;
}
function isDesc(a,b){let x=b,n=0;while(x&&x.parent&&n<60){if(x.parent===a.id)return true;x=pieceById(x.parent);n++;}return false;}
function toWorldSpace(p){
  const par=pieceById(p.parent);
  if(par){
    p.keys=p.keys.map(k=>{const w=compose(pose(par,k.t),k);return {t:k.t,x:r3(w.x),y:r3(w.y),z:r3(w.z),r:r3(w.r),rx:k.rx||0,rz:k.rz||0,ease:!!k.ease};});
    const w=compose(pose(par,time),p.base); p.base={x:r3(w.x),y:r3(w.y),z:r3(w.z),r:r3(w.r),rx:p.base.rx||0,rz:p.base.rz||0};
  }
  p.parent=null;
}
function setParent(p,parId){
  if(p.ride) getOff(p);
  if(p.parent) toWorldSpace(p);
  const par=pieceById(parId);
  if(!par||par===p||isDesc(p,par)) return;
  p.keys=p.keys.map(k=>{const l=decompose(pose(par,k.t),k);return {t:k.t,x:r3(l.x),y:r3(l.y),z:r3(l.z),r:r3(l.r),rx:k.rx||0,rz:k.rz||0,ease:!!k.ease};});
  const l=decompose(pose(par,time),p.base); p.base={x:r3(l.x),y:r3(l.y),z:r3(l.z),r:r3(l.r),rx:p.base.rx||0,rz:p.base.rz||0};
  p.parent=par.id;
}
function toLocalXZ(p,wx,wz,t){const par=p.parent&&pieceById(p.parent);if(!par)return {x:wx,z:wz};const l=decompose(pose(par,t),{x:wx,y:0,z:wz,r:0});return {x:l.x,z:l.z};}
/* what the piece panel edits: local (parent-relative) values for grouped pieces */
function panePose(p,t){return (p.parent&&!p.ride)?localPose(p,t):pose(p,t);}
function travel(p,t){
  const k=p.keys; if(k.length<2) return {dist:0,speed:0};
  let dist=0,speed=0;
  for(let i=0;i<k.length-1;i++){
    const a=k[i],b=k[i+1],len=Math.hypot(b.x-a.x,b.z-a.z),dt=(b.t-a.t)||1;
    if(t>=b.t) dist+=len;
    else{ if(t>a.t){dist+=len*(t-a.t)/dt;speed=len/dt;} break; }
  }
  return {dist,speed};
}
function worldTravel(p,g,t,s){
  const ud=g.userData, ta=t>=.05?t-.05:t, tb=t>=.05?t:t+.05;
  const a=ta===t?s:pose(p,ta), b=tb===t?s:pose(p,tb);
  const speed=Math.hypot(b.x-a.x,b.z-a.z)/.05;
  if(ud.lx===undefined){ud.lx=s.x;ud.lz=s.z;ud.acc=0;}
  const d=Math.hypot(s.x-ud.lx,s.z-ud.lz); if(d<3) ud.acc+=d; ud.lx=s.x; ud.lz=s.z;
  return {dist:ud.acc,speed};
}
function upsertKey(p,t,s){
  t=r3(t); const k={t,x:r3(s.x),y:r3(s.y),z:r3(s.z),r:r3(s.r),rx:r3(s.rx||0),rz:r3(s.rz||0),ease:false};
  const i=p.keys.findIndex(q=>Math.abs(q.t-t)<.5/FPS);
  if(i>=0){k.ease=!!p.keys[i].ease;p.keys[i]=k;} else {p.keys.push(k);p.keys.sort((a,b)=>a.t-b.t);}
}
function editPose(p,patch){
  if(p.keys.length){const t=snap(time),cur=rawPose(p,t);Object.assign(cur,patch);upsertKey(p,t,cur);}
  else Object.assign(p.base,patch);
  changed();
}

/* ---------- shot camera ---------- */
function povRaw(p,t){
  const s=p?pose(p,t):{x:0,y:0,z:0,r:0};
  const e=p?(EYE[p.type==='person'&&p.style==='pin'?'pin':p.type]||[0,1,0]):[0,1.6,0], sz=p?p.size:{x:1,y:1,z:1}, r=s.r*D2R;
  const ex=e[0]*sz.x, ey=e[1]*sz.y, ez=e[2]*sz.z;
  const pos=new THREE.Vector3(s.x+ex*Math.cos(r)+ez*Math.sin(r),s.y+ey,s.z-ex*Math.sin(r)+ez*Math.cos(r));
  const pv=povAt(t),a=(s.r+pv.yaw)*D2R,b=pv.pitch*D2R;
  return {pos,dir:new THREE.Vector3(Math.sin(a)*Math.cos(b),Math.sin(b),Math.cos(a)*Math.cos(b))};
}
/* なめらかさ: a soft average of where the eye is and where it looks around each moment */
function povCam(p,t){
  const w=state.cam.povSmooth||0;
  if(w<.02){const r=povRaw(p,t);return {pos:r.pos,tgt:r.pos.clone().addScaledVector(r.dir,5)};}
  const n=8,D=new THREE.Vector3(),P=povRaw(p,t).pos;
  for(let i=-n;i<=n;i++){const f=i/n,wt=Math.exp(-f*f*2.5),r=povRaw(p,clamp(t+f*w,0,state.duration));D.addScaledVector(r.dir,wt);}
  if(D.lengthSq()<1e-6) D.set(0,0,1); D.normalize();
  return {pos:P,tgt:P.clone().addScaledVector(D,5)};
}
const rigPiece=()=>state.pieces.find(q=>q.type==='camrig')||null;
function rigRaw(rp,t){
  const c=state.cam, s=pose(rp,t), pos=new THREE.Vector3(s.x,s.y,s.z);
  const tp=c.rigAim&&c.target&&c.target!==rp.id?pieceById(c.target):null; let dir;
  if(tp){const ts=pose(tp,t);dir=new THREE.Vector3(ts.x,ts.y+c.lookH,ts.z).sub(pos);if(dir.lengthSq()<1e-6)dir.set(0,0,1);dir.normalize();}
  else{const a=s.r*D2R,b=-(s.rx||0)*D2R;dir=new THREE.Vector3(Math.sin(a)*Math.cos(b),Math.sin(b),Math.cos(a)*Math.cos(b));}
  return {pos,dir,roll:s.rz||0};
}
function rigCam(rp,t){ /* same なめらかさ as the first-person camera */
  const w=state.cam.povSmooth||0;
  if(w<.02){const r=rigRaw(rp,t);return {pos:r.pos,tgt:r.pos.clone().addScaledVector(r.dir,5),roll:r.roll};}

  const k={t:r3(t),px:r3(src[0].x),py:r3(src[0].y),pz:r3(src[0].z),tx:r3(src[1].x),ty:r3(src[1].y),tz:r3(src[1].z)};
  const i=c.keys.findIndex(q=>Math.abs(q.t-t)<.5/FPS);
  if(i>=0)c.keys[i]=k;else{c.keys.push(k);c.keys.sort((a,b)=>a.t-b.t);}
  manualCam=false; changed(); toast(`${tc(t)} にカメラキーを打ちました`);
}
function jumpKey(keys,next){
  const e=.5/FPS,ts=keys.map(k=>k.t);
  const t=next?ts.find(x=>x>time+e):[...ts].reverse().find(x=>x<time-e);
  if(t===undefined) toast('この先にキーはありません'); else{if(playing)setPlaying(false);setTime(t);}
}
function arm(b,label){
  if(b.dataset.armed) return true;
  b.dataset.armed='1'; const orig=b.innerHTML; b.textContent=label; b.classList.remove('ib');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML=orig;}},3000);
  return false;
}
function loadState(s){

  syncMeshes(); changed(); renderPane(); updateTimeUI(); updateCtl(); updateHint();

function act(a,v,b){
  const p=selPiece(),c=state.cam;
  switch(a){
  case 'add': if(v==='pin') addPiece('person','pin'); else addPiece(v); break;
  case 'style': if(p){p.style=v;changed();renderPane();} break;
  case 'carform': if(p&&CARS.has(p.type)&&p.type!==v){p.type=v;changed();renderPane();} break;
  case 'dup': if(p){const q=JSON.parse(JSON.stringify(p));q.id=uid();q.name=nextName(q.type);q.base.x+=1.2;q.keys.forEach(k=>k.x+=1.2);if(q.ride)q.seat=freeSeat(q.ride,q);state.pieces.push(q);changed();select(q.id);} break;
  case 'del': if(p){if(!arm(b,'もう一度で削除'))return;state.pieces.forEach(q=>{if(q.ride===p.id)getOff(q);if(q.parent===p.id)toWorldSpace(q);});state.pieces=state.pieces.filter(q=>q!==p);if(c.target===p.id)c.target=null;selId=null;changed();renderPane();toast(`${p.name}を削除しました`);} break;
  case 'color': if(p){p.color=v;changed();renderPane();} break;
  case 'toggle':
    if(v==='face'&&p){p.face=!p.face;changed();renderPane();}
    else if(v==='rigaim'){state.cam.rigAim=!state.cam.rigAim;changed();renderPane();}
    else if(v==='vissel'&&p){p.hidden=!p.hidden;changed();renderPane();}
    else if(v==='hideshot'&&p){p.hideInShot=!p.hideInShot;changed();renderPane();}
    else if(v==='povself'){state.cam.povSelf=!state.cam.povSelf;changed();renderPane();}
    else if(v==='gridshot'){state.scene.gridShot=!state.scene.gridShot;changed();renderPane();}
    else if(v==='loop'){pref.loop=!pref.loop;savePref();b.setAttribute('aria-pressed',String(pref.loop));}
    break;
  case 'key-add': if(p){const t=snap(time);upsertKey(p,t,rawPose(p,t));changed();toast(`${p.name}：${tc(t)} にキーを打ちました`);if(p.keys.length===1)renderPane();} break;
  case 'key-del': if(p){const t=snap(time),before=rawPose(p,t),i=p.keys.findIndex(k=>Math.abs(k.t-t)<.5/FPS);
    if(i<0){toast('この時間にキーはありません');break;}

  case 'key-prev': case 'key-next': jumpKey(p?p.keys:[],a==='key-next'); break;
  case 'key-clear': if(p){if(!arm(b,'もう一度で全部消す'))return;p.base=rawPose(p,time);p.keys=[];changed();renderPane();} break;
  case 'key-jump': case 'camkey-jump': if(playing)setPlaying(false); setTime(+v); break;
  case 'dur': state.duration=clamp(Math.round((state.duration+(+v))*10)/10,1,120); if(time>state.duration)time=state.duration; changed(); updateTimeUI(); renderPane(); break;
  case 'mode': if(v==='rig'&&!rigPiece()){ensureRig();toast('撮影カメラをコマとして置きました。編集・真上ビューでドラッグして動かせます',3200);} c.mode=v; manualCam=false; updateCtl(); updateHint(); changed(); renderPane(); break;
  case 'lens': c.lens=+v; changed(); renderPane(); break;
  case 'aspect': c.aspect=v; changed(); renderPane(); break;
  case 'camkey-add': addCamKey(); break;
  case 'ease-key': if(p){const t=snap(time),k=p.keys.find(q=>Math.abs(q.t-t)<.5/FPS);
    if(!k){toast('この時間にキーがありません。キーの印をタップしてから押してください');break;}
    k.ease=!k.ease;changed();renderPane();toast(k.ease?`${tc(k.t)} のキーにイージーイーズを付けました`:`${tc(k.t)} のキーのイーズを外しました`);} break;
  case 'ease-all': if(p&&p.keys.length){const all=p.keys.every(q=>q.ease);p.keys.forEach(q=>q.ease=!all);changed();renderPane();toast(all?'イーズを全部外しました':'全部のキーにイージーイーズを付けました');} break;
  case 'povkey-add': {const t=snap(time),pv=povAt(time);upsertPov(t,pv.yaw,pv.pitch);changed();renderPane();toast(`${tc(t)} に向きのキーを打ちました`);} break;
  case 'povkey-del': {const t=snap(time),i=c.povKeys.findIndex(k=>Math.abs(k.t-t)<.5/FPS);if(i<0){toast('この時間に向きのキーはありません');break;}const pv=povAt(time);c.povKeys.splice(i,1);if(!c.povKeys.length)c.pov={yaw:r3(wrap180(pv.yaw)),pitch:r3(pv.pitch)};changed();renderPane();} break;
  case 'povkey-clear': {if(!arm(b,'もう一度で全部消す'))return;const pv=povAt(time);c.pov={yaw:r3(wrap180(pv.yaw)),pitch:r3(pv.pitch)};c.povKeys=[];changed();renderPane();} break;
  case 'listmode': pref.listMode=v; savePref(); renderPane(); break;
  case 'tab-cam': pref.tab='cam'; savePref(); renderPane(); panes.scrollTop=0; break;
  case 'spin': if(p){
    if(v.split(':')[0]==='r'&&p.face&&p.keys.length>1){toast('「進行方向を向く」がオンのコマは向きが自動で決まります。オフにすると回せます');break;}
    const [f,dir]=v.split(':'),dd=dir==='-1'?-360:360,s0=panePose(p,time),nv=(s0[f]||0)+dd;
    editPose(p,{[f]:nv});renderPane();toast(`${{r:'向き',rx:'前後',rz:'横'}[f]}を${dd<0?'逆向きに':''}1回転させました（${Math.round(nv)}°）`);} break;
  case 'pivot': if(p){p.pivot=v;changed();renderPane();} break;
  case 'open-add': openAdd(); break;
  case 'rig-select': case 'rig-motion': {const rp=rigPiece()||ensureRig(); if(selId!==rp.id) selId=rp.id; pref.tab=a==='rig-select'?'piece':'motion'; pref.collapsed=false; savePref(); select(rp.id);} break;
  case 'pick': if(selId===v){pref.tab='piece';savePref();renderPane();panes.scrollTop=0;}else select(v); break;
  case 'vis': {const q=pieceById(v);if(q){q.hidden=!q.hidden;changed();renderPane();}} break;
  case 'camkey-del': {const t=snap(time),i=c.keys.findIndex(k=>Math.abs(k.t-t)<.5/FPS);
    if(i<0){toast('この時間にカメラキーはありません');break;} c.keys.splice(i,1); manualCam=false; changed();} break;
  case 'sync-edit': editCam.position.copy(shotCam.position); editCtl.target.copy(shotCtl.target); editCtl.update(); toast('編集ビューを撮影カメラの位置に移しました'); break;
  case 'export': exportScene(); break;
  case 'grid': state.scene.grid=v; applyScene(); changed(); renderPane(); break;
  case 'bg': state.scene.bg=v; applyScene(); changed(); renderPane(); break;
  case 'ground': state.scene.ground=v; applyScene(); changed(); renderPane(); break;
  case 'reset-sample': if(!arm(b,'もう一度でサンプルに戻す'))return; loadState(normalize(sampleScene())); toast('サンプルに戻しました'); break;
  case 'clear-all': {if(!arm(b,'もう一度ですべて消す'))return; const s=sampleScene(); s.pieces=[]; s.cam.target=null; s.cam.keys=[]; s.scene=Object.assign({},state.scene); loadState(normalize(s)); toast('空のシーンにしました');} break;

const keysOf=o=>o==='cam'?state.cam.keys:o==='pov'?state.cam.povKeys:(pieceById(o)||{keys:[]}).keys;

panes.addEventListener('pointerdown',e=>{
  const tr=e.target.closest('.tltrack'); if(!tr||recording) return;
  const rect=tr.getBoundingClientRect(), tk=e.target.closest('.tk');

  if(!tlDrag||e.pointerId!==tlDrag.id) return;
  const dx=e.clientX-tlDrag.x; if(Math.abs(dx)>4) tlDrag.moved=true; if(!tlDrag.moved) return;

function tlEnd(e){

/* ---------- downloads (video + scene file) ---------- */
/* saving files: inside claude.ai the viewer's save dialog; as a standalone web app the share sheet (iPhone) or a normal download */
async function fallbackSave(filename,data){
  const mime=filename.endsWith('.json')?'application/json':(data&&data.type)||'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{
    const file=new File([blob],filename,{type:blob.type||mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return {status:'saved'};}
      catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
    }
  }catch(e){if(e&&e.code==='declined')throw e;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  return {status:'saved'};
}
let dl=null;
if(window.claude&&typeof window.claude.use==='function'){
  try{window.claude.use('downloads').then(d=>{dl=d||null;}).catch(()=>{});}catch(e){}
}else dl={save:({filename,data})=>fallbackSave(filename,data)};
function saveErr(e){
  const code=e&&e.code;
  if(code==='declined') return '保存をキャンセルしました。';
  if(code==='rate_limited') return '少し待ってから、もう一度試してください。';
  if(code==='too_large') return 'ファイルが大きすぎて保存できませんでした。尺を短くして録り直してください。';
  return 'この表示では保存できませんでした。';
}
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`;};
async function exportScene(){
  if(!dl){toast('この表示ではファイルを保存できません');return;}
  try{const r=await dl.save({filename:`previz-scene-${stamp()}.json`,data:JSON.stringify(state,null,1)});if(r&&r.status==='saved')toast('シーンを書き出しました');}
  catch(e){toast(saveErr(e));}
}

/* ---------- recording ---------- */
const recCanvas=$('#reccv');
let recR=null,mr=null,chunks=[],recSize=[1280,720],sheetBlob=null,sheetURL=null;
function pickMime(){
  if(typeof window.MediaRecorder!=='function') return null;
  if(typeof MediaRecorder.isTypeSupported!=='function') return '';
  for(const m of ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']) if(MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function updateRecBtn(){$('#recLabel').textContent=recording?'STOP':'REC';}
function startRecording(){
  const mime=pickMime();
  if(mime===null||typeof recCanvas.captureStream!=='function'){toast('このブラウザは録画に対応していません');return;}
  try{
    if(!recR){recR=new THREE.WebGLRenderer({canvas:recCanvas,antialias:true});recR.shadowMap.enabled=true;recR.shadowMap.type=THREE.PCFSoftShadowMap;recR.setPixelRatio(1);}
  }catch(e){toast('録画を開始できませんでした');return;}
  const a=ASPECTS[state.cam.aspect]; let w,h;
  if(a>=1){w=1280;h=Math.round(1280/a/2)*2;}else{h=1280;w=Math.round(1280*a/2)*2;}
  recR.setSize(w,h,false); recSize=[w,h];
  if(view!=='camera') setView('camera');
  setPlaying(false); time=0; manualCam=false; updateScene(0); recR.render(scene,shotCam);
  let stream;
  try{stream=recCanvas.captureStream(30);}catch(e){toast('録画を開始できませんでした');return;}
  try{mr=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}):new MediaRecorder(stream);}
  catch(e){try{mr=new MediaRecorder(stream);}catch(e2){toast('録画を開始できませんでした');return;}}
  chunks=[];
  mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
  const thisMr=mr;
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    const type=((thisMr.mimeType||mime||'video/webm').split(';')[0])||'video/webm';
    const blob=new Blob(chunks,{type});
    if(blob.size) showSheet(blob,type); else toast('録画データが空でした');
  };
  recording=true; document.body.classList.add('is-rec'); updateCtl(); updateHint(); updateRecBtn();
  mr.start(250); setPlaying(true);
}
function stopRecording(){
  if(!recording) return;
  recording=false; document.body.classList.remove('is-rec'); setPlaying(false); updateCtl(); updateHint(); updateRecBtn();
  try{mr.stop();}catch(e){}
}
function showSheet(blob,type){
  sheetBlob=blob; if(sheetURL) URL.revokeObjectURL(sheetURL); sheetURL=URL.createObjectURL(blob);
  const v=$('#sheetVideo'); v.src=sheetURL;
  $('#sheetMeta').textContent=`${recSize[0]}×${recSize[1]} · ${tc(state.duration)} · ${type.indexOf('mp4')>=0?'MP4':'WebM'} · ${(blob.size/1048576).toFixed(1)}MB`;
  $('#sheetStatus').textContent=dl?'':'この表示では動画を保存できません。claude.aiで開くと保存できます。';
  $('#saveVideo').disabled=!dl; $('#sheet').hidden=false;
  try{v.play().catch(()=>{});}catch(e){}
}
$('#recbtn').addEventListener('click',()=>{recording?stopRecording():startRecording();});
$('#closeSheet').addEventListener('click',()=>{$('#sheet').hidden=true;const v=$('#sheetVideo');try{v.pause();}catch(e){}});
$('#saveVideo').addEventListener('click',async()=>{
  if(!dl||!sheetBlob) return;
  const ext=sheetBlob.type.indexOf('mp4')>=0?'mp4':'webm';
  try{const r=await dl.save({filename:`previz-${stamp()}.${ext}`,data:sheetBlob});$('#sheetStatus').textContent=r&&r.status==='saved'?'保存しました。':'';}
  catch(e){$('#sheetStatus').textContent=saveErr(e);}
});

/* ---------- start ---------- */
new ResizeObserver(resize).observe(stage);
applyScene(); resize(); syncMeshes(); syncLabels(); rebuildPaths(); rebuildMarks(); renderPane(); updateTimeUI(); applyLock();
$('#labelBtn').setAttribute('aria-pressed',String(pref.labels)); setView('edit');
$('#undoBtn').addEventListener('click',undo); $('#redoBtn').addEventListener('click',redo); updHist();
window.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const tg=e.target; if(tg&&/^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName)) return;
  const k=e.key.toLowerCase();
  if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();} else if(k==='y'){e.preventDefault();redo();}
});
requestAnimationFrame(loop);
if(fromSample) setTimeout(()=>toast('サンプルシーンです。▶で再生、上の「カメラ」で撮影ビューに切り替わります',5200),300);
})();
</script>

<script>
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
